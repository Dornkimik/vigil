[package]
name = "vigil"
version = "0.1.0"
edition = "2024"
description = "Lightweight background malware scanner for downloads and Steam content - a supplement to Windows Defender"
license = "MIT"
build = "build.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow"] }
notify = "8"
aho-corasick = "1.1"
base64 = "0.23"
flate2 = "1"
goblin = { version = "0.10", default-features = false, features = ["std", "pe32", "pe64"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = "0.17"
dirs = "7"
ureq = "3"
# Modules for sandbox reports, live VirusTotal data, Android and macOS formats are left out.
yara-x = { version = "1.22", default-features = false, features = [
    "constant-folding",
    "exact-atoms",
    "fast-regexp",
    "generate-proto-code",
    "console-module",
    "dotnet-module",
    "elf-module",
    "hash-module",
    "lnk-module",
    "math-module",
    "pe-module",
    "string-module",
    "time-module",
    "zip-module",
] }

[dependencies.windows-sys]
version = "0.61"
features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
